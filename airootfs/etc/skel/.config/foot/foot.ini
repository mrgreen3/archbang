[main]
font=JetBrains Mono Nerd Font Mono:size=10
shell=/usr/bin/bash
pad=10x10

[colors-dark]
alpha=0.9
# Catppuccin Mocha
foreground = cdd6f4
background = 1e1e2e

# Normal colors
regular0 = 45475a   # black (surface1)
regular1 = f38ba8   # red
regular2 = a6e3a1   # green
regular3 = f9e2af   # yellow
regular4 = 89b4fa   # blue
regular5 = f5c2e7   # magenta (pink)
regular6 = 94e2d5   # cyan (teal)
regular7 = bac2de   # white (subtext1)

# Bright colors
bright0  = 585b70   # surface2
bright1  = f38ba8
bright2  = a6e3a1
bright3  = f9e2af
bright4  = 89b4fa
bright5  = f5c2e7
bright6  = 94e2d5
bright7  = a6adc8

[key-bindings]
clipboard-paste=Control+Shift+v
clipboard-copy=Control+Shift+c
primary-paste=Shift+Insert

