# Mango WM Configuration
# Reference: https://github.com/mangowm/mango/wiki/

# AUTOSTART
exec_once=noctalia

# APPEARANCE
border_px=2
border_radius=2
no_radius_when_single=0
no_border_when_single=0

root_color=0x18120cff
border_color=0x00000000
focus_color=0xf9ba72ff
maximized_screen_color=0x251e17ff
urgent_color=0xffb4abff
scratchpad_color=0x251e17ff
global_color=0xd4c4b5ff
overlay_color=0xeee0d5ff

focused_opacity=1.0
unfocused_opacity=1.0

# GAPS & SCRATCHPAD
gap_inner_horizontal=3
gap_inner_vertical=3
gap_outer_horizontal=5
gap_outer_vertical=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# BLUR
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# SHADOWS
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadows_color=0x000000ff

# ANIMATIONS
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=0
animation_fade_out=0
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=150
animation_duration_focus=150
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# LAYOUTS
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

tag_rule=id:1,layout_name:tile
tag_rule=id:2,open_as_floating:1
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:monocle
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# OVERVIEW
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# KEYBOARD
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
numlock_on=0

# TRACKPAD  (requires relogin to apply)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# MOUSE  (requires relogin to apply)
mouse_natural_scrolling=0

# MISC
focus_on_activate=1
sloppy_focus=0
warp_cursor=1
cursor_size=24
cursor_theme=Adwaita
drag_tile_to_tile=1
axis_bind_apply_timeout=100
idle_inhibit_ignore_visible=0
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30

# KEY BINDINGS

# --- Volume / Brightness (noctalia OSD) ---
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# --- Session ---
bind=SUPER,r,reload_config
bind=SUPER,m,quit
bind=SUPER,l,spawn,noctalia msg session lock

# --- Screenshot ---
bind=SUPER,p,spawn,sh -c 'f=~/Pictures/$(date +%d%m%y%H%M).png && grim "$f" && notify-send "Screenshot saved" "$f"'
bind=SUPER+SHIFT,s,spawn,~/Scripts/screenshot -r

# --- Launch ---
bind=SUPER,k,spawn,l3afpad ~/Documents/Keybindings
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,v,spawn,noctalia msg panel-toggle control-center media
bind=SUPER+SHIFT,space,spawn,noctalia msg window-switcher
bind=SUPER,b,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT,e,spawn,noctalia msg panel-toggle control-center power
bind=SUPER,Return,spawn,foot
bind=SUPER,w,spawn,firefox
bind=SUPER,h,spawn,l3afpad ~/Documents/Guide
bind=SUPER,f,spawn,thunar

# --- Windows ---
bind=SUPER,q,killclient,
bind=SUPER+CTRL,s,togglefloating,
bind=SUPER,d,spawn,noctalia msg panel-toggle control-center system
bind=SUPER,F11,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,togglegaps
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# --- Focus ---
bind=SUPER,Tab,toggleoverview
bind=ALT,Tab,focusstack,next
bind=SUPER+CTRL,Left,focusdir,left
bind=SUPER+CTRL,Right,focusdir,right
bind=SUPER+CTRL,Up,focusdir,up
bind=SUPER+CTRL,Down,focusdir,down

# --- Swap ---
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# --- Move (floating) ---
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# --- Resize (floating) ---
bind=ALT+SHIFT,Up,resizewin,+0,-50
bind=ALT+SHIFT,Down,resizewin,+0,+50
bind=ALT+SHIFT,Left,resizewin,-50,+0
bind=ALT+SHIFT,Right,resizewin,+50,+0

# --- Gaps ---
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1

# --- Layout ---
bind=SUPER,n,switch_layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# --- Tags: switch ---
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# --- Tags: move window to tag ---
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# --- Tags: drag to adjacent monitor ---
bind=CTRL+SUPER+SHIFT,Left,tagtoleft,0
bind=CTRL+SUPER+SHIFT,Right,tagtoright,0

# --- Monitor focus ---
bind=SUPER+Alt,Left,focusmon,left
bind=SUPER+Alt,Right,focusmon,right
bind=SUPER+CTRL+Alt,Left,tagmon,left
bind=SUPER+CTRL+Alt,Right,tagmon,right

# MOUSE BINDINGS
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# AXIS BINDINGS
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# WINDOW RULES
window_rule=focused_opacity:0.85,app_id:foot
window_rule=unfocused_opacity:0.75,app_id:foot

# LAYER RULES
